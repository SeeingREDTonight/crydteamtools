# ─────────────────────────────────────────────────────────────────────
#  Crydteam Speed Test — plugin configuration
#  by Steven (Fragmon) — Crydteam · youtube.com/@crydteamprinting
#
#  HOW TO ENABLE:
#    1. Remove the leading '#' from the [speed_test] line below.
#    2. Run FIRMWARE_RESTART.
#  Everything else is OPTIONAL — every option is listed with its
#  default value. Uncomment and change only what you need.
#
#  This file was copied (not linked) by the installer, so your edits
#  survive plugin updates.
# ─────────────────────────────────────────────────────────────────────

#[speed_test]

## Machine kinematics: cartesian, corexy or corexz. Determines which
## steppers move for a given axis test.
#structure: cartesian

## Axis used when a test command is called without AXIS=...
#default_axis: X

## Safety distance (mm) kept from both axis ends during test moves.
#margin: 20.0

## Where to park the OTHER axis during single-axis tests. Unset = it
## stays where homing left it (usually an axis end). Use this to keep
## the toolhead clear of obstacles near the ends of travel, e.g.
## park_x: 175 centres X on a 350 mm bed while Y is tested.
#park_x: 175
#park_y: 175

## What to run whenever a test step loses steps, to re-sync AWD /
## dual-motor belt pairs before the next step (homing does not).
##   auto  (default) accelerometer sync (SYNC_MOTORS, MRX8024
##         motors-sync) if loaded, else StallGuard sync (MOTOR_SYNC,
##         this suite) if [motor_sync] is enabled, else skip with a
##         console note. Does nothing on single-motor axes.
##   none  never re-sync
##   any other value is run as G-code, e.g.
##   skip_resync_gcode: SYNC_MOTORS AXES=x,y RETRIES=5
#skip_resync_gcode: auto

## Z height (mm) the toolhead is lifted to before testing, so the
## nozzle clears clips, glue sticks and print remains.
#z_pos: 20.0

## Log TMC driver values (run_current, driver registers) into the
## CSV/HTML reports.
#monitor_tmc: True

## Distance (mm) from the endstop where the fast probe moves start,
## measured from the end the axis homes to (min or max). Smaller =
## shorter trip back to the endstop after every step, but less room if
## a skip leaves the toolhead out of position.
## 0 = automatic (20 % of the axis travel).
#start_offset: 0

## Speed (mm/s) and acceleration (mm/s²) used for positioning moves
## between measurements (NOT for the measurements themselves).
#travel_speed: 100
#travel_accel: 3000

## Tolerated deviation in full steps when comparing stepper MCU
## positions after re-homing. Above this, the move counts as
## "steps lost".
#max_missed: 1.5

## Testbench mode: a single stepper on a bench (only one axis wired,
## no full printer). Skips homing/kinematics checks.
#testbench: False

## Hardware current ceiling (A) for the current search and benchmark
## stages of SPEED_TEST_FIND_LIMITS. 0 = use the configured
## run_current as ceiling.
#max_current: 0

## Motor temperature sensors for SPEED_TEST_TORQUE_FADE, which measures
## how the acceleration limit drops as the motor heats up. Give the full
## Klipper section name. Use motor_sensor for one shared sensor, or the
## per-axis variants when every motor has its own thermistor.
#motor_sensor: temperature_sensor motor
#motor_sensor_x: temperature_sensor motor_x
#motor_sensor_y: temperature_sensor motor_y

## Where CSV and HTML reports are written.
#output_dir: ~/printer_data/config/Speedtest
