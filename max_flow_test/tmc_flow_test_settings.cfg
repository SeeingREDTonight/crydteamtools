# ─────────────────────────────────────────────────────────────────────
#  Crydteam TMC Flow Test — plugin configuration
#  by Steven (Fragmon) — Crydteam · youtube.com/@crydteamprinting
#
#  HOW TO ENABLE:
#    The installer activates the [tmc_flow_test] line below for you
#    (this plugin needs the section to work at all). If it is still
#    commented out, remove the leading '#' and run FIRMWARE_RESTART.
#    NOTE: older installs got this section from
#    tmc_flow_test_macros.cfg — it lives here now, so there must be
#    exactly ONE active [tmc_flow_test] in your config.
#  Everything else is OPTIONAL — every option is listed with its
#  default value. Uncomment and change only what you need.
#
#  This file was copied (not linked) by the installer, so your edits
#  survive plugin updates.
# ─────────────────────────────────────────────────────────────────────

#[tmc_flow_test]

## Name of the extruder stepper whose TMC driver is monitored.
#extruder_stepper: extruder

## Filament diameter (mm) — used to convert flow (mm³/s) to feed rate.
#filament_diameter: 1.75

## Length (mm) of the hotend melt zone. Only used for reporting.
#melt_zone_length: 42.0

## Minimum hotend temperature (°C) required before the test starts.
#min_hotend_temp: 180

## Fixed low reference flow (mm³/s). When START is well above it, two
## slip-free reference steps (reference_flow and reference_flow+5)
## run before the sweep and anchor the trigger baselines and the SGT
## auto-tune — so a high START can't blind the detection. 0 disables.
## Override per run with REF_FLOW= on TMC_FLOW_FIND_MAX.
#reference_flow: 15

## Part-cooling fan speed during the test (0-100 %). Fans have a real
## impact on max flow (the heater works 10-20 % harder at 100 %), so
## the value is locked once the test starts. Override per run with
## FAN_SPEED= on TMC_FLOW_FIND_MAX.
#test_fan_speed: 0

## Explicit fan object to control instead of the primary part-cooling
## fan (M106), e.g. "fan_generic aux_fan".
#fan_object_name:

## Additional thermistors to log alongside the extruder, as a comma-
## separated list of printer-config section names, e.g.:
##   extra_thermistors: chamber, heater_generic heatbreak
## Names that don't resolve are silently skipped at test start.
#extra_thermistors:

## Chamber / filter fans to run for the whole flow test (air filtering
## only), as a comma-separated list of fan names, e.g.:
##   chamber_fans: Nevermore, chamber
## The type is detected automatically:
##   [fan_generic X]     → run at 100 % (SET_FAN_SPEED)
##   [temperature_fan X] → target set to 1 °C (or its min_temp, if higher) so it runs
## Each fan's previous speed / target is restored when the test ends.
#chamber_fans:

## ── Filament failure detection (defaults; the TMC_FLOW_FIND_MAX
## parameter of the same name in upper case overrides them per run) ──
##
## BDWidth sensor used for the feed check: auto (first one found),
## its name (e.g. bdwidth fila_width_0), or none.
#bdwidth: auto
## Stop when BDWidth sees less than this share of the commanded feed
## (0.6 = 60 %). 0 = record only, never stop.
#bdw_min_ratio: 0.6
## [filament_motion_sensor] (BTT SFS etc.) used when there is no
## BDWidth: auto, its name, or none.
#encoder: auto
## mm of commanded filament without an encoder pulse that counts as
## stopped. 0 = auto (2 x the sensor's detection_length, at least 10).
#encoder_gap: 0
##
## Idle heater readings before and after the run (seconds): settle
## time, then measuring time. Used for drift correction and the melt
## limit. idle_measure: 0 turns both readings (and the melt limit) off.
#idle_settle: 20
#idle_measure: 60

## Where CSV and HTML reports are written.
#output_dir: ~/printer_data/config/Flowtest
